name: prawdowid-backend

# Deployment w Coolify: TYLKO backend.
#
# Po co osobny plik: Coolify klonuje wyłącznie to repo (do /artifacts/<uuid>),
# więc serwis z `build.context: ../frontend` nie ma szans się zbudować
# ("unable to prepare context: path \"/artifacts/frontend\" not found").
# Frontend wdrażasz jako DRUGĄ aplikację Coolify z repo prawdowid/frontend.
# Pełna instrukcja: docs/coolify.md
#
# Lokalny test tego pliku:
#   docker compose -f docker-compose.coolify.yml up --build

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    # Sekrety i konfigurację runtime ustaw w UI Coolify. Nie używamy env_file:
    # .env nie jest w repo, a składnia required: false wymaga Compose >= 2.24.
    environment:
      # Musi zgadzać się z mapowaniem portów poniżej.
      PORT: "3000"
      NODE_ENV: production
    ports:
      - "3000:3000"
    volumes:
      # Nazwany wolumen, nie ./data. Katalog data/ jest w .gitignore, więc
      # w klonie Coolify by nie istniał: Docker utworzyłby go jako root,
      # a proces działa jako bun (uid 1000) i nie mógłby pisać.
      # Wolumen dziedziczy właściciela (/app chown bun:bun) z obrazu.
      - prawdowid_data:/app/data
      # Korpus jest commitowany w repo i tylko czytany.
      - ./corpus:/app/corpus:ro
    healthcheck:
      test:
        [
          "CMD",
          "bun",
          "-e",
          "fetch('http://127.0.0.1:3000/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

volumes:
  prawdowid_data:
