name: prawdowid

# Deploy w Coolify: buduje ten plik domyślnie (Docker Compose, /docker-compose.yml).
# W tym repo jest tylko backend. Frontend to OSOBNA aplikacja Coolify
# (prawdowid/frontend, własny Dockerfile, port 3001) — dlatego nie ma tu
# żadnego `build.context: ../frontend`, które wywalało deploy.
#
# Lokalnie: docker compose up --build
# Sekrety ustaw w Environment Variables w Coolify (lokalnie w .env).

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      PORT: "3000"
      NODE_ENV: production
    ports:
      - "3000:3000"
    volumes:
      # data/ jest w .gitignore, więc w klonie Coolify go nie ma. Named volume
      # zamiast bind mounta, żeby proces bun (uid 1000) miał prawo zapisu.
      - prawdowid_data:/app/data
      # Korpus jest też w obrazie (COPY corpus). Mount tylko do odczytu.
      - ./corpus:/app/corpus:ro
    healthcheck:
      test:
        [
          "CMD",
          "bun",
          "-e",
          "fetch('http://127.0.0.1:3000/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

volumes:
  prawdowid_data:
